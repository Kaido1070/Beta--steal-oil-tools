name: Sticky Production Layout v5.77

on:
  push:
    paths:
      - '.github/workflows/fix-sticky-rate-v577.yml'

permissions:
  contents: write

jobs:
  fix_sticky:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix sticky production placement
        run: |
          python3 <<'PY'
          from pathlib import Path

          css=Path('css/pages/oil-visual-builder.css')
          s=css.read_text(encoding='utf-8')
          old="""/* v5.75: compact sticky production result; full details stay in the existing result card. */\n.v575-sticky-rate{position:fixed;z-index:1080;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translate(-50%,calc(100% + 26px));width:min(420px,calc(100vw - 24px));min-height:54px;padding:7px 9px 7px 12px;display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid rgba(154,102,255,.58);border-radius:14px;background:rgba(12,16,27,.94);box-shadow:0 12px 34px rgba(0,0,0,.42),inset 0 0 0 1px rgba(255,255,255,.035);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#f5f7ff;opacity:0;pointer-events:none;transition:transform .2s ease,opacity .2s ease,border-color .2s ease;cursor:pointer;text-align:left}.v575-sticky-rate.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}.v575-sticky-rate:hover{border-color:#ae84ff}.v575-sticky-rate>span{display:grid;gap:1px;min-width:0}.v575-sticky-rate small{color:#9ea8ba;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.v575-sticky-rate strong{font-size:21px;line-height:1.05;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v575-sticky-rate i{font-style:normal;flex:0 0 auto;padding:7px 9px;border-radius:9px;background:rgba(142,91,255,.14);color:#cebaff;font-size:10px;font-weight:900}.v575-result-details{scroll-margin:86px}.v575-result-details.v575-result-focus{animation:v575ResultFocus .9s ease}@keyframes v575ResultFocus{0%,100%{box-shadow:inherit}35%{box-shadow:0 0 0 2px rgba(155,101,255,.5),0 0 24px rgba(125,72,238,.18)}}\n@media(max-width:520px){.v575-sticky-rate{width:calc(100vw - 18px);bottom:max(8px,env(safe-area-inset-bottom));min-height:50px;border-radius:13px}.v575-sticky-rate strong{font-size:19px}.v575-sticky-rate i{padding:6px 8px}}\n"""
          new="""/* v5.77: slim sticky production bar with safe content spacing. */\n#oilView{padding-bottom:86px}\n.v575-sticky-rate{position:fixed;z-index:1080;left:50%;bottom:max(6px,env(safe-area-inset-bottom));transform:translate(-50%,calc(100% + 20px));width:min(360px,calc(100vw - 28px));min-height:44px;padding:5px 6px 5px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid rgba(154,102,255,.52);border-radius:12px;background:rgba(10,14,24,.96);box-shadow:0 8px 24px rgba(0,0,0,.36),inset 0 0 0 1px rgba(255,255,255,.03);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#f5f7ff;opacity:0;pointer-events:none;transition:transform .2s ease,opacity .2s ease,border-color .2s ease;cursor:pointer;text-align:left}.v575-sticky-rate.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}.v575-sticky-rate:hover{border-color:#ae84ff}.v575-sticky-rate>span{display:grid;gap:0;min-width:0}.v575-sticky-rate small{color:#929caf;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.055em;line-height:1}.v575-sticky-rate strong{font-size:17px;line-height:1.12;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v575-sticky-rate i{font-style:normal;flex:0 0 auto;padding:6px 8px;border-radius:8px;background:rgba(142,91,255,.12);color:#cbb8ff;font-size:9px;font-weight:900}.v575-result-details{scroll-margin:76px}.v575-result-details.v575-result-focus{animation:v575ResultFocus .9s ease}@keyframes v575ResultFocus{0%,100%{box-shadow:inherit}35%{box-shadow:0 0 0 2px rgba(155,101,255,.5),0 0 24px rgba(125,72,238,.18)}}\n@media(max-width:520px){#oilView{padding-bottom:78px}.v575-sticky-rate{width:calc(100vw - 24px);bottom:max(5px,env(safe-area-inset-bottom));min-height:42px;border-radius:11px;padding:5px 6px 5px 9px}.v575-sticky-rate strong{font-size:16px}.v575-sticky-rate i{padding:5px 7px}}\n"""
          if old not in s: raise SystemExit('sticky CSS block missing')
          css.write_text(s.replace(old,new,1),encoding='utf-8')

          build=Path('scripts/consolidate-beta.sh')
          b=build.read_text(encoding='utf-8')
          if 'VERSION="5.76"' not in b: raise SystemExit('Expected v5.76 build')
          build.write_text(b.replace('VERSION="5.76"','VERSION="5.77"',1),encoding='utf-8')

          ch=Path('js/changelog.js')
          c=ch.read_text(encoding='utf-8')
          marker='window.STOT_CHANGELOG=Object.freeze([\n'
          entry='''  Object.freeze({version:"5.77",date:"Sep 2 2026",changes:Object.freeze([\n    "Slimmed and repositioned the sticky Current Production card",\n    "Added bottom spacing so Preset Summary and Share Preset are never covered"\n  ])}),\n'''
          if 'version:"5.77"' not in c: c=c.replace(marker,marker+entry,1)
          ch.write_text(c,encoding='utf-8')

          test=Path('tests/smoke-beta.mjs')
          t=test.read_text(encoding='utf-8').replace("'5.76'","'5.77'")
          t=t.replace('stot-v5.76-layout-save-v1','stot-v5.77-layout-save-v1')
          anchor="assert.ok(await page.locator('#v575StickyRate').evaluate(el => el.classList.contains('show')));\n"
          extra="""const stickyBox = await page.locator('#v575StickyRate').boundingBox();\nassert.ok(stickyBox && stickyBox.height <= 52, 'Sticky production card is too tall');\nconst oilPaddingBottom = await page.locator('#oilView').evaluate(el => parseFloat(getComputedStyle(el).paddingBottom));\nassert.ok(oilPaddingBottom >= 70, 'Oil view needs bottom spacing for sticky card');\n"""
          if extra not in t:
              if anchor not in t: raise SystemExit('Sticky smoke anchor missing')
              t=t.replace(anchor,anchor+extra,1)
          test.write_text(t,encoding='utf-8')
          PY

      - name: Build v5.77
        run: bash scripts/consolidate-beta.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1

      - name: Run full browser smoke suite
        run: node tests/smoke-beta.mjs

      - name: Commit tested layout fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix sticky production layout v5.77'
          git push origin HEAD:main
