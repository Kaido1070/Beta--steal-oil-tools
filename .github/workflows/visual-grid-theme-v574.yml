name: Visual Grid Theme v5.74

on:
  push:
    paths:
      - '.github/workflows/visual-grid-theme-v574.yml'

permissions:
  contents: write

jobs:
  restyle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restyle visual grid
        run: |
          python3 <<'PY'
          from pathlib import Path

          css=Path('css/pages/oil-visual-builder.css')
          s=css.read_text(encoding='utf-8')
          s=s.replace('/* STOT Oil visual plot builder — v5.72 */','/* STOT Oil visual plot builder — v5.74 */',1)
          old='.v572-grid-stage,.v572-editor-grid-preview{position:relative;display:block;aspect-ratio:1/1;width:100%;border:2px solid var(--area);border-radius:9px;overflow:hidden;background:#070a11}.v572-grid-cells,.v572-grid-placements{position:absolute;inset:4px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:2px}.v572-grid-cells span{min-width:0;min-height:0;border:1px solid color-mix(in srgb,var(--area) 65%,#0a0d14);border-radius:3px;background:color-mix(in srgb,var(--area) 68%,#172013)}'
          new='.v572-grid-stage,.v572-editor-grid-preview{position:relative;display:block;aspect-ratio:1/1;width:100%;border:2px solid color-mix(in srgb,var(--area) 78%,#263047 22%);border-radius:9px;overflow:hidden;background:linear-gradient(180deg,rgba(8,12,22,.88),rgba(7,10,18,.96));box-shadow:inset 0 0 18px color-mix(in srgb,var(--area) 5%,transparent)}.v572-grid-cells,.v572-grid-placements{position:absolute;inset:4px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:2px}.v572-grid-cells span{min-width:0;min-height:0;border:1px solid color-mix(in srgb,var(--area) 22%,rgba(255,255,255,.09));border-radius:3px;background:rgba(255,255,255,.025);box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);transition:background .15s ease,border-color .15s ease}'
          if old not in s:
              raise SystemExit('Could not locate visual grid base styles')
          s=s.replace(old,new,1)
          old2='.v572-plot-card.mountain-summit .v572-grid-cells span{background:#f3f3f3;border-color:#b9b9b9}.v572-plot-card.mountain-summit .v572-plot-head{color:#f4f4f4}'
          new2='.v572-plot-card.mountain-summit .v572-grid-cells span{background:rgba(255,255,255,.035);border-color:rgba(245,245,245,.28)}.v572-plot-card.mountain-summit .v572-plot-head{color:#f4f4f4}'
          if old2 not in s:
              raise SystemExit('Could not locate Mountain Summit cell override')
          s=s.replace(old2,new2,1)
          s += '\n/* v5.74: keep area identity on borders/titles while cells blend into the site theme. */\n.v572-plot-card{background:linear-gradient(180deg,rgba(15,20,34,.88),rgba(10,14,25,.94));border-color:color-mix(in srgb,var(--area) 52%,rgba(89,104,135,.42));}\n.v572-plot-card:hover{border-color:color-mix(in srgb,var(--area) 82%,#7f8baa 18%);box-shadow:0 8px 22px rgba(0,0,0,.18),inset 0 0 0 1px color-mix(in srgb,var(--area) 8%,transparent)}\n.v572-plot-head i{color:color-mix(in srgb,var(--area) 78%,#fff 22%);background:color-mix(in srgb,var(--area) 8%,#111728 92%);border-color:color-mix(in srgb,var(--area) 28%,rgba(255,255,255,.08))}\n.v572-grid-stage:hover .v572-grid-cells span{border-color:color-mix(in srgb,var(--area) 30%,rgba(255,255,255,.11));background:color-mix(in srgb,var(--area) 3%,rgba(255,255,255,.025))}\n'
          css.write_text(s,encoding='utf-8')

          build=Path('scripts/consolidate-beta.sh')
          b=build.read_text(encoding='utf-8')
          if 'VERSION="5.73"' not in b: raise SystemExit('Expected v5.73 build')
          build.write_text(b.replace('VERSION="5.73"','VERSION="5.74"',1),encoding='utf-8')

          ch=Path('js/changelog.js')
          c=ch.read_text(encoding='utf-8')
          marker='window.STOT_CHANGELOG=Object.freeze([\n'
          entry='''  Object.freeze({version:"5.74",date:"Sep 2 2026",changes:Object.freeze([\n    "Refined the visual 5×5 map to blend with the dark site theme",\n    "Area colors now emphasize borders, titles and multipliers instead of filling every empty cell",\n    "Kept all Forest, Desert, Volcano and Mountain color identities"\n  ])}),\n'''
          if 'version:"5.74"' not in c:
              c=c.replace(marker,marker+entry,1)
          ch.write_text(c,encoding='utf-8')

          test=Path('tests/smoke-beta.mjs')
          t=test.read_text(encoding='utf-8')
          t=t.replace("'5.73'","'5.74'")
          t=t.replace('stot-v5.73-layout-save-v1','stot-v5.74-layout-save-v1')
          test.write_text(t,encoding='utf-8')
          PY

      - name: Build v5.74
        run: bash scripts/consolidate-beta.sh

      - name: Verify visual theme
        run: |
          grep -q 'version:"5.74"' js/site-config.js
          grep -q 'background:rgba(255,255,255,.025)' css/pages/oil-visual-builder.css
          grep -q 'background:rgba(255,255,255,.035)' css/pages/oil-visual-builder.css
          grep -q 'v5.74: keep area identity' css/pages/oil-visual-builder.css
          grep -q 'version:"5.74"' js/changelog.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1

      - name: Run full browser smoke suite
        run: node tests/smoke-beta.mjs

      - name: Commit tested visual theme
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine visual grid theme v5.74'
          git push origin HEAD:main
