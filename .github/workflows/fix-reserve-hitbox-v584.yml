name: Fix Reserve Hitbox v5.84

on:
  push:
    paths:
      - .github/workflows/fix-reserve-hitbox-v584.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply hitbox fix
        run: python3 scripts/apply-reserve-hitbox-v584.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/stot-http.log
          exit 1

      - name: Verify hitbox boundaries
        run: node tests/reserve-hitbox-v584.mjs

      - name: Commit verified fix
        run: |
          rm -f package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/app.bundle.css css/v539-03.css index.html
          git commit -m 'Limit refinery reserve toggle hitbox v5.84'
          git push origin HEAD:main
