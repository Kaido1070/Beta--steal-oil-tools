name: Finish Current Production Navigation
on:
  push:
    paths:
      - '.github/workflows/finish-sticky-navigation.yml'
permissions:
  contents: write
jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply prepared fix
        run: |
          python3 -c "import re,base64,pathlib; w=pathlib.Path('.github/workflows/apply-sticky-navigation-v578.yml').read_text(); n=base64.b64decode(re.search(r'NEWFUNC: ([A-Za-z0-9+/=]+)',w).group(1)).decode(); n=n.replace('details.getBoundingClientRect().top>window.innerHeight-36','details.getBoundingClientRect().top>window.innerHeight*.62'); p=pathlib.Path('js/pages/oil-visual-builder.js'); s=p.read_text(); a=s.index('  function ensureStickyRate(){'); b=s.index('\\n\\n  window.STOT_VISUAL_PLOT_BUILDER',a); p.write_text(s[:a]+n+s[b:])"
          python3 -c "from pathlib import Path; p=Path('css/pages/oil-visual-builder.css'); s=p.read_text(); x='.v575-sticky-rate>*{pointer-events:none;user-select:none;-webkit-user-select:none}.v575-sticky-rate{touch-action:manipulation}'; p.write_text(s if x in s else s+x)"
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); import re; s=re.sub(r'\\?v=5\\.(?:77|79)', '?v=5.80', s); p.write_text(s)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Test requested behavior
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import {chromium} from 'playwright'; const b=await chromium.launch({headless:true}); const p=await b.newPage({viewport:{width:773,height:617}}); await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'}); await p.locator('.tabs button[data-view=oil]').click(); await p.waitForTimeout(120); const bar=p.locator('#v575StickyRate'),d=p.locator('#layoutResultDetails'); assert.equal(await bar.count(),1); await d.evaluate(el=>{el.getBoundingClientRect=()=>({top:500,bottom:700,left:0,right:300,width:300,height:200,x:0,y:500,toJSON(){return {}}});}); await p.evaluate(()=>dispatchEvent(new Event('scroll'))); await p.waitForTimeout(80); assert.ok(await bar.evaluate(e=>e.classList.contains('show')),'bar must still show when result is near the bottom of the screen'); await bar.click(); await p.waitForTimeout(80); assert.ok(!(await bar.evaluate(e=>e.classList.contains('show'))),'bar hides immediately after tap'); assert.ok(await d.evaluate(e=>e.classList.contains('v575-result-focus')),'tap targets result'); await d.evaluate(el=>{el.getBoundingClientRect=()=>({top:200,bottom:400,left:0,right:300,width:300,height:200,x:0,y:200,toJSON(){return {}}});}); await p.evaluate(()=>dispatchEvent(new Event('scroll'))); await p.waitForTimeout(80); assert.ok(!(await bar.evaluate(e=>e.classList.contains('show'))),'bar stays hidden at result'); await d.evaluate(el=>{el.getBoundingClientRect=()=>({top:500,bottom:700,left:0,right:300,width:300,height:200,x:0,y:500,toJSON(){return {}}});}); await p.evaluate(()=>dispatchEvent(new Event('scroll'))); await p.waitForTimeout(80); assert.ok(await bar.evaluate(e=>e.classList.contains('show')),'bar returns above result'); assert.ok((await p.locator('script[src*=oil-visual-builder]').getAttribute('src')).includes('v=5.80')); await b.close(); console.log('Current Production behavior passed')"
      - name: Commit verified fix
        run: |
          rm -f package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/pages/oil-visual-builder.js css/pages/oil-visual-builder.css index.html
          git commit -m 'Keep Current Production visible until result area'
          git push origin HEAD:main
