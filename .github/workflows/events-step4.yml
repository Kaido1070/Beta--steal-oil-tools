name: Step 4 Separate Events

on:
  push:
    branches: [consolidation-work]
    paths:
      - '.github/workflows/events-step4.yml'

permissions:
  contents: write

jobs:
  split-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation-work
          fetch-depth: 0

      - name: Patch build pipeline for Events page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/consolidate-beta.sh')
          s = p.read_text(encoding='utf-8')
          s = s.replace('VERSION="5.61"', 'VERSION="5.62"', 1)

          marker = '# Fix a stale startup call left in the pinned core.'
          if '# Step 4: move Events behavior and styles out of the shared core.' not in s:
              step = r'''# Step 4: move Events behavior and styles out of the shared core.
          python3 <<'PY_EVENTS'
          from pathlib import Path

          app_path = Path('js/app.js')
          events_path = Path('js/pages/events.js')
          events_path.parent.mkdir(parents=True, exist_ok=True)
          app = app_path.read_text(encoding='utf-8')
          start_marker = 'const mapEvents=['
          end_marker = '\nconst GAME_CODES=['

          if start_marker in app:
              start = app.index(start_marker)
              end = app.index(end_marker, start)
              block = app[start:end].strip()
              events_path.write_text(
                  '/* STOT Events page runtime v5.62 — extracted from js/app.js */\n'
                  + block
                  + '\n\n/* Initial Events render now belongs to this page module. */\n'
                  + 'renderEvents();\n'
                  + 'document.documentElement.dataset.stotEventsPage="5.62";\n',
                  encoding='utf-8'
              )
              app = app[:start] + app[end+1:]
              startup = 'renderCodes();\nrenderCompare();\nrenderEvents();'
              if startup not in app:
                  raise SystemExit('Could not locate Events startup call in js/app.js')
              app = app.replace(startup, 'renderCodes();\nrenderCompare();', 1)
              app_path.write_text(app, encoding='utf-8')
          else:
              if not events_path.exists():
                  raise SystemExit('Events already removed from app.js but js/pages/events.js is missing')
              if 'function renderEvents()' in app or 'const mapEvents=[' in app:
                  raise SystemExit('Events runtime still remains in js/app.js')

          css_path = Path('css/main.css')
          page_css = Path('css/pages/events.css')
          css = css_path.read_text(encoding='utf-8')
          css_start = '/* Events */'
          css_end = '\n.codes-toolbar'
          if css_start in css:
              start = css.index(css_start)
              end = css.index(css_end, start)
              block = css[start:end].strip()
              page_css.parent.mkdir(parents=True, exist_ok=True)
              page_css.write_text('/* STOT Events page CSS v5.62 */\n' + block + '\n', encoding='utf-8')
              css_path.write_text(css[:start] + css[end+1:], encoding='utf-8')
          elif not page_css.exists():
              raise SystemExit('Events CSS already removed from css/main.css but css/pages/events.css is missing')
          PY_EVENTS

          '''
              if marker not in s:
                  raise SystemExit('Could not find insertion point in consolidate-beta.sh')
              s = s.replace(marker, step + marker, 1)

          old_style = "f'<link rel=\"stylesheet\" href=\"css/app.bundle.css?v={version}\">\\n<link rel=\"stylesheet\" href=\"css/pages/database.css?v={version}\">',"
          new_style = "f'<link rel=\"stylesheet\" href=\"css/app.bundle.css?v={version}\">\\n<link rel=\"stylesheet\" href=\"css/pages/database.css?v={version}\">\\n<link rel=\"stylesheet\" href=\"css/pages/events.css?v={version}\">',"
          if old_style in s:
              s = s.replace(old_style, new_style, 1)
          elif 'css/pages/events.css?v={version}' not in s:
              raise SystemExit('Could not patch Events stylesheet into index generator')

          old_scripts = "f'<script defer src=\"js/pages/database.js?v={version}\"></script>\\n'\n    f'<script defer src=\"js/beta-patches.bundle.js?v={version}\"></script>\\n'"
          new_scripts = "f'<script defer src=\"js/pages/database.js?v={version}\"></script>\\n'\n    f'<script defer src=\"js/pages/events.js?v={version}\"></script>\\n'\n    f'<script defer src=\"js/beta-patches.bundle.js?v={version}\"></script>\\n'"
          if old_scripts in s:
              s = s.replace(old_scripts, new_scripts, 1)
          elif 'js/pages/events.js?v={version}' not in s:
              raise SystemExit('Could not patch Events script into index generator')

          s = s.replace('node --check js/pages/database.js\nnode --check js/beta-patches.bundle.js', 'node --check js/pages/database.js\nnode --check js/pages/events.js\nnode --check js/beta-patches.bundle.js', 1)
          s = s.replace('! grep -q \'function renderDb()\' js/app.js', '! grep -q \'function renderDb()\' js/app.js\n! grep -q \'function renderEvents()\' js/app.js\n! grep -q \'const mapEvents=\[\' js/app.js', 1)
          s = s.replace('grep -q \'function renderDb()\' js/pages/database-core.js', 'grep -q \'function renderDb()\' js/pages/database-core.js\ngrep -q \'function renderEvents()\' js/pages/events.js\ngrep -q \'const mapEvents=\[\' js/pages/events.js', 1)
          s = s.replace('grep -q "css/pages/database.css?v=${VERSION}" index.html', 'grep -q "css/pages/database.css?v=${VERSION}" index.html\ngrep -q "css/pages/events.css?v=${VERSION}" index.html', 1)
          s = s.replace('grep -q "js/pages/database.js?v=${VERSION}" index.html', 'grep -q "js/pages/database.js?v=${VERSION}" index.html\ngrep -q "js/pages/events.js?v=${VERSION}" index.html', 1)
          s = s.replace('echo "Consolidated Beta v${VERSION}: Database separated into js/pages/database.js"', 'echo "Consolidated Beta v${VERSION}: Database and Events separated into page modules"', 1)
          p.write_text(s, encoding='utf-8')

          t = Path('tests/smoke-beta.mjs')
          test = t.read_text(encoding='utf-8').replace('5.61', '5.62')
          test = test.replace(
              "assert.equal(await page.locator('html').getAttribute('data-stot-database-page'), '5.62');",
              "assert.equal(await page.locator('html').getAttribute('data-stot-database-page'), '5.62');\nassert.equal(await page.locator('html').getAttribute('data-stot-events-page'), '5.62');",
              1
          )
          test = test.replace(
              "assert.deepEqual(scriptSrcs, ['/js/game-data.js', '/js/app.js', '/js/pages/database.js', '/js/beta-patches.bundle.js']);",
              "assert.deepEqual(scriptSrcs, ['/js/game-data.js', '/js/app.js', '/js/pages/database.js', '/js/pages/events.js', '/js/beta-patches.bundle.js']);"
          )
          test = test.replace(
              "assert.deepEqual(styleHrefs, ['/css/app.bundle.css', '/css/pages/database.css']);",
              "assert.deepEqual(styleHrefs, ['/css/app.bundle.css', '/css/pages/database.css', '/css/pages/events.css']);"
          )
          event_test = r'''
          assert.equal(await page.evaluate(() => typeof renderEvents), 'function');
          await page.locator('.tabs button[data-view="events"]').click();
          await page.waitForTimeout(120);
          assert.ok(await page.locator('#eventsView').evaluate(el => el.classList.contains('active')));
          assert.notEqual((await page.locator('#localTimezone').textContent())?.trim(), '—');
          assert.notEqual((await page.locator('#nextEventName').textContent())?.trim(), '—');
          assert.ok(await page.locator('#eventList .event-card').count() >= 4, 'Events cards did not render');
          assert.ok(await page.locator('#adminTimes .admin-day').count() > 0, 'Admin event times did not render');
          '''
          anchor = "await page.locator('.tabs button[data-view=\"database\"]').click();"
          if event_test.strip() not in test:
              if anchor not in test:
                  raise SystemExit('Could not locate Database smoke-test anchor')
              test = test.replace(anchor, event_test + '\n' + anchor, 1)
          reload_anchor = "assert.equal(await page.locator('html').getAttribute('data-stot-database-page'), '5.62');\nassert.notEqual(await page.locator('body').evaluate(el => getComputedStyle(el).visibility), 'hidden');"
          reload_new = "assert.equal(await page.locator('html').getAttribute('data-stot-database-page'), '5.62');\nassert.equal(await page.locator('html').getAttribute('data-stot-events-page'), '5.62');\nassert.notEqual(await page.locator('body').evaluate(el => getComputedStyle(el).visibility), 'hidden');"
          if reload_anchor in test:
              test = test.replace(reload_anchor, reload_new, 1)
          test = test.replace('SMOKE PASS: v5.62 Database page separated, calculators, Preset UI, images, filters, reload', 'SMOKE PASS: v5.62 Database + Events separated, calculators, Preset UI, images, filters, reload')
          t.write_text(test, encoding='utf-8')
          PY

      - name: Build v5.62 runtime
        run: bash scripts/consolidate-beta.sh

      - name: Verify Events extraction statically
        shell: bash
        run: |
          test -s js/pages/events.js
          test -s css/pages/events.css
          ! grep -q 'function renderEvents()' js/app.js
          ! grep -q 'const mapEvents=\[' js/app.js
          grep -q 'function renderEvents()' js/pages/events.js
          grep -q 'const mapEvents=\[' js/pages/events.js
          grep -q 'data-stot-events-page' js/pages/events.js
          ! grep -q '/\* Events \*/' css/main.css
          grep -q '/\* Events \*/' css/pages/events.css
          grep -q 'js/pages/events.js?v=5.62' index.html
          grep -q 'css/pages/events.css?v=5.62' index.html

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1

      - name: Run full browser smoke suite
        run: node tests/smoke-beta.mjs

      - name: Commit tested Events separation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/consolidate-beta.sh tests/smoke-beta.mjs index.html css/main.css css/app.bundle.css css/pages/database.css css/pages/events.css js/game-data.js js/app.js js/pages/database-core.js js/pages/database.js js/pages/events.js js/beta-patches.bundle.js
          if git diff --cached --quiet; then
            echo "No Events changes to commit"
            exit 0
          fi
          git commit -m "Separate Events page runtime v5.62"
          git push origin HEAD:consolidation-work
