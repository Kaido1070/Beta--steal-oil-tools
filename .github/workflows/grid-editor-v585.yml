name: Grid Editor v5.85

on:
  push:
    paths:
      - .github/workflows/grid-editor-v585.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install grid editor in page
        run: python3 scripts/apply-grid-editor-v585.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/stot-http.log
          exit 1

      - name: Verify quick fill and interactive grid
        run: node tests/grid-editor-v585.mjs

      - name: Commit verified update
        run: |
          rm -f package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add interactive drill grid editor v5.85'
          git push origin HEAD:main
