name: Step 7 Separate Drills Final

on:
  push:
    branches: [consolidation-work]

permissions:
  contents: write

jobs:
  split-drills:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation-work
          fetch-depth: 0

      - name: Apply tested Step 7 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/step7-drills-v566-retry2.yml').read_text(encoding='utf-8')
          marker='      - name: Patch build pipeline for Drills page\n'
          start=src.index('        run: |\n', src.index(marker))+len('        run: |\n')
          end=src.index('\n      - name: Build v5.66 runtime', start)
          block=src[start:end]
          out=[]
          for line in block.splitlines():
              out.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/step7-patch.sh').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          bash /tmp/step7-patch.sh

      - name: Make startup guard Step 7 aware
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/consolidate-beta.sh')
          s=p.read_text(encoding='utf-8')
          old='''old = 'calcSale();\\ncalcProduction();\\ncalcDrill();'
          new = 'calcSale();\\nif(typeof calcProduction==="function")calcProduction();\\ncalcDrill();'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Could not locate expected startup sequence in js/app.js')'''
          new='''old = 'calcSale();\\ncalcProduction();\\ncalcDrill();'
          safe_with_drill = 'calcSale();\\nif(typeof calcProduction==="function")calcProduction();\\ncalcDrill();'
          safe_without_drill = 'calcSale();\\nif(typeof calcProduction==="function")calcProduction();'
          if old in s:
              s = s.replace(old, safe_with_drill, 1)
          elif safe_with_drill in s or safe_without_drill in s:
              pass
          else:
              raise SystemExit('Could not locate expected startup sequence in js/app.js')'''
          if old not in s:
              raise SystemExit('Legacy startup guard block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Build v5.66 runtime
        run: bash scripts/consolidate-beta.sh

      - name: Verify Drills extraction statically
        shell: bash
        run: |
          test -s js/pages/drills.js
          test -s css/pages/drills.css
          ! grep -q 'function calcDrill()' js/app.js
          ! grep -q 'function renderPicker()' js/app.js
          ! grep -q 'const ds=' js/app.js
          grep -q 'function calcDrill()' js/pages/drills.js
          grep -q 'function renderPicker()' js/pages/drills.js
          grep -q 'stotDrillsPage="5.66"' js/pages/drills.js
          grep -q 'css/pages/drills.css?v=5.66' index.html
          grep -q 'js/pages/drills.js?v=5.66' index.html
          grep -q 'stot-local-version" content="5.66"' index.html
          node --check js/app.js
          node --check js/pages/drills.js
          node --check js/pages/compare.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1

      - name: Run full browser smoke suite
        run: node tests/smoke-beta.mjs

      - name: Commit tested Drills separation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/consolidate-beta.sh js/app.js js/pages/drills.js js/pages/compare.js js/pages/events.js js/pages/codes.js css/main.css css/app.bundle.css css/pages/drills.css css/pages/compare.css index.html tests/smoke-beta.mjs
          git commit -m 'Separate Drills page runtime v5.66'
          git push origin HEAD:consolidation-work
