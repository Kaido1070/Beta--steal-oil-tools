name: Step 9 Separate Oil

on:
  push:
    branches: [consolidation-work]

permissions:
  contents: write

jobs:
  split-oil:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation-work
          fetch-depth: 0

      - name: Patch build pipeline for Oil page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('scripts/consolidate-beta.sh')
          s=p.read_text(encoding='utf-8')
          if 'VERSION="5.67"' not in s:
              raise SystemExit('Expected v5.67 build pipeline')
          s=s.replace('VERSION="5.67"','VERSION="5.68"',1)

          anchor='# Keep already-separated page module version markers aligned with this build.'
          step=r'''# Step 9: move Oil / Hour layout calculator out of the shared core.
          # Historical Oil presentation patches still live in the consolidated patch bundle for now;
          # this step gives the base Oil calculator/runtime a single page owner without changing UX.
          python3 <<'PY_OIL'
          from pathlib import Path

          app_path=Path('js/app.js')
          oil_path=Path('js/pages/oil.js')
          oil_path.parent.mkdir(parents=True,exist_ok=True)
          app=app_path.read_text(encoding='utf-8')
          start_marker='/* oil layout */'
          end_marker='/* shared drill/catalog helpers */'

          if start_marker in app:
              start=app.index(start_marker)
              end=app.index(end_marker,start)
              block=app[start:end].strip()
              oil_path.write_text(
                  '/* STOT Oil / Hour page runtime v5.68 — extracted from js/app.js */\n'
                  + block + '\n\n'
                  + 'document.documentElement.dataset.stotOilPage="5.68";\n',
                  encoding='utf-8'
              )
              app=app[:start]+app[end:]
              stale='if(typeof calcProduction==="function")calcProduction();'
              if stale in app:
                  app=app.replace(stale,'',1)
              app_path.write_text(app,encoding='utf-8')
          else:
              if not oil_path.exists():
                  raise SystemExit('Oil already removed from app.js but js/pages/oil.js is missing')
              if 'const LAYOUT_AREAS=' in app or 'function renderLayout()' in app or 'function calcLayout()' in app:
                  raise SystemExit('Oil runtime still remains in js/app.js')
          PY_OIL

          '''
          if anchor not in s:
              raise SystemExit('Could not locate Oil insertion point')
          s=s.replace(anchor,step+anchor,1)

          old="    ('js/pages/sale.js','stotSalePage','Sale'),\n]"
          new="    ('js/pages/sale.js','stotSalePage','Sale'),\n    ('js/pages/oil.js','stotOilPage','Oil'),\n]"
          if old not in s:
              raise SystemExit('Could not add Oil to page version sync')
          s=s.replace(old,new,1)

          old_scripts='''    f'<script defer src="js/pages/sale.js?v={version}"></script>\\n'\n    f'<script defer src="js/pages/drills.js?v={version}"></script>\\n'\n'''
          new_scripts='''    f'<script defer src="js/pages/sale.js?v={version}"></script>\\n'\n    f'<script defer src="js/pages/oil.js?v={version}"></script>\\n'\n    f'<script defer src="js/pages/drills.js?v={version}"></script>\\n'\n'''
          if old_scripts not in s:
              raise SystemExit('Could not add Oil script to generated index')
          s=s.replace(old_scripts,new_scripts,1)

          s=s.replace('node --check js/pages/sale.js\nnode --check js/pages/database-core.js','node --check js/pages/sale.js\nnode --check js/pages/oil.js\nnode --check js/pages/database-core.js',1)
          s=s.replace("! grep -q 'function calcSale()' js/app.js","! grep -q 'function calcSale()' js/app.js\n! grep -q 'const LAYOUT_AREAS=' js/app.js\n! grep -q 'function renderLayout()' js/app.js\n! grep -q 'function calcLayout()' js/app.js",1)
          s=s.replace("grep -q 'function calcSale()' js/pages/sale.js","grep -q 'function calcSale()' js/pages/sale.js\ngrep -q 'const LAYOUT_AREAS=' js/pages/oil.js\ngrep -q 'function renderLayout()' js/pages/oil.js\ngrep -q 'function calcLayout()' js/pages/oil.js",1)
          s=s.replace('grep -q "js/pages/sale.js?v=${VERSION}" index.html','grep -q "js/pages/sale.js?v=${VERSION}" index.html\ngrep -q "js/pages/oil.js?v=${VERSION}" index.html',1)
          s=s.replace('Database, Events, Codes, Drill Compare, Drills and Sale separated into page modules','Database, Events, Codes, Drill Compare, Drills, Sale and Oil separated into page modules',1)

          # After Oil is page-owned there is no stale calcProduction startup expected in the core.
          old_guard='''if old in s:\n    s = s.replace(old, safe_with_drill, 1)\nelif safe_with_drill in s or safe_without_drill in s or 'if(typeof calcProduction==="function")calcProduction();' in s:\n    pass\nelse:\n    raise SystemExit('Could not locate expected startup sequence in js/app.js')'''
          new_guard='''if old in s:\n    s = s.replace(old, safe_with_drill, 1)\nelif safe_with_drill in s or safe_without_drill in s or 'if(typeof calcProduction==="function")calcProduction();' in s:\n    pass\nelif 'const viewBadges=' in s:\n    pass\nelse:\n    raise SystemExit('Could not locate expected startup sequence in js/app.js')'''
          if old_guard not in s:
              raise SystemExit('Could not make startup guard Oil-aware')
          s=s.replace(old_guard,new_guard,1)

          p.write_text(s,encoding='utf-8')

          t=Path('tests/smoke-beta.mjs')
          test=t.read_text(encoding='utf-8').replace('5.67','5.68')

          marker="assert.equal(await page.locator('html').getAttribute('data-stot-sale-page'), '5.68');"
          if marker not in test:
              raise SystemExit('Could not locate Sale version assertion')
          test=test.replace(marker,marker+"\nassert.equal(await page.locator('html').getAttribute('data-stot-oil-page'), '5.68');",1)

          old_list="assert.deepEqual(scriptSrcs, ['/js/game-data.js', '/js/app.js', '/js/pages/sale.js', '/js/pages/drills.js', '/js/pages/compare.js', '/js/pages/database.js', '/js/pages/events.js', '/js/pages/codes.js', '/js/beta-patches.bundle.js']);"
          new_list="assert.deepEqual(scriptSrcs, ['/js/game-data.js', '/js/app.js', '/js/pages/sale.js', '/js/pages/oil.js', '/js/pages/drills.js', '/js/pages/compare.js', '/js/pages/database.js', '/js/pages/events.js', '/js/pages/codes.js', '/js/beta-patches.bundle.js']);"
          if old_list not in test:
              raise SystemExit('Could not update script request list for Oil')
          test=test.replace(old_list,new_list,1)

          oil_anchor="assert.ok(await page.locator('#layoutAreas').count());"
          oil_test=r'''
          assert.equal(await page.evaluate(() => typeof renderLayout), 'function');
          assert.equal(await page.evaluate(() => typeof calcLayout), 'function');
          assert.equal(await page.evaluate(() => Array.isArray(layoutPlots) ? layoutPlots.length : -1), 15);
          assert.deepEqual(await page.evaluate(() => LAYOUT_AREAS.map(x => [x.name,x.mult,x.plots])), [
            ['Forest',1,6],['Desert',2,3],['Volcano Sides',3,2],['Volcano Core',5,1],['Mountain Sides',6,2],['Mountain Summit',10,1]
          ]);
          await page.locator('#layoutHours').fill('2');
          await page.waitForTimeout(60);
          assert.notEqual((await page.locator('#layoutTimeOil').textContent())?.trim(), '—', 'Oil time calculator did not render');
          '''
          if oil_anchor not in test:
              raise SystemExit('Could not locate Oil smoke insertion point')
          test=test.replace(oil_anchor,oil_anchor+'\n'+oil_test,1)

          reload_marker="assert.equal(await page.locator('html').getAttribute('data-stot-sale-page'), '5.68');\nassert.notEqual(await page.locator('body').evaluate(el => getComputedStyle(el).visibility), 'hidden');"
          reload_repl="assert.equal(await page.locator('html').getAttribute('data-stot-sale-page'), '5.68');\nassert.equal(await page.locator('html').getAttribute('data-stot-oil-page'), '5.68');\nassert.notEqual(await page.locator('body').evaluate(el => getComputedStyle(el).visibility), 'hidden');"
          if reload_marker not in test:
              raise SystemExit('Could not locate reload Oil assertion point')
          test=test.replace(reload_marker,reload_repl,1)
          test=test.replace('Drill Compare + Drills + Sale separated','Drill Compare + Drills + Sale + Oil separated')
          t.write_text(test,encoding='utf-8')
          PY

      - name: Build v5.68 runtime
        run: bash scripts/consolidate-beta.sh

      - name: Verify Oil extraction statically
        shell: bash
        run: |
          test -s js/pages/oil.js
          ! grep -q 'const LAYOUT_AREAS=' js/app.js
          ! grep -q 'function renderLayout()' js/app.js
          ! grep -q 'function calcLayout()' js/app.js
          grep -q 'const LAYOUT_AREAS=' js/pages/oil.js
          grep -q 'function renderLayout()' js/pages/oil.js
          grep -q 'function calcLayout()' js/pages/oil.js
          grep -q 'stotOilPage="5.68"' js/pages/oil.js
          grep -q 'js/pages/oil.js?v=5.68' index.html
          grep -q 'stot-local-version" content="5.68"' index.html
          node --check js/app.js
          node --check js/pages/oil.js
          node --check js/pages/sale.js
          node --check js/pages/drills.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1

      - name: Run full browser smoke suite
        run: node tests/smoke-beta.mjs

      - name: Commit tested Oil separation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/consolidate-beta.sh js/app.js js/pages/oil.js js/pages/sale.js js/pages/drills.js js/pages/compare.js js/pages/events.js js/pages/codes.js css/app.bundle.css css/pages/drills.css css/pages/compare.css css/pages/database.css css/pages/events.css css/pages/codes.css index.html tests/smoke-beta.mjs js/beta-patches.bundle.js js/pages/database.js
          git commit -m 'Separate Oil page runtime v5.68'
          git push origin HEAD:consolidation-work
