name: Consolidate Beta Runtime

on:
  push:
    branches: [consolidation-work]
    paths:
      - scripts/consolidate-beta.sh
      - .github/workflows/consolidate-beta.yml
      - js/game-data.js
      - js/app.js
      - js/v539-*.js
      - js/beta-oil-order.js
      - js/beta-first-visit.js
      - js/beta-image-atlas-fix.js
      - js/beta-preset-visuals.js
      - js/beta-database-images.js
      - js/beta-database-redesign.js
      - css/main.css
      - css/v539-*.css
      - css/beta-first-visit.css
      - css/beta-image-atlas-fix.css
      - css/beta-preset-visuals.css
      - css/beta-database-images.css
      - css/beta-database-redesign.css

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: consolidation-work
          fetch-depth: 0

      - name: Build consolidated runtime
        run: bash scripts/consolidate-beta.sh

      - name: Validate generated files
        run: |
          test -s index.html
          test -s css/app.bundle.css
          test -s js/game-data.js
          test -s js/app.js
          test -s js/beta-patches.bundle.js
          test "$(grep -c 'js/game-data.js?v=5.59' index.html)" -eq 1
          test "$(grep -c 'js/app.js?v=5.59' index.html)" -eq 1
          test "$(grep -c 'js/beta-patches.bundle.js?v=5.59' index.html)" -eq 1
          test "$(grep -c 'css/app.bundle.css?v=5.59' index.html)" -eq 1
          grep -q '^window.STOT_GAME_DATA=' js/game-data.js
          ! grep -q '^const drills=' js/app.js
          ! grep -q '^calcProduction();$' js/app.js

      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/app.bundle.css js/game-data.js js/app.js js/beta-patches.bundle.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build separated game data runtime v5.59"
            git push origin HEAD:consolidation-work
          fi
