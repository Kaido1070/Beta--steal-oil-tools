name: Apply Sticky Navigation v5.78
on:
  push:
    paths:
      - '.github/workflows/apply-sticky-navigation-v578.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch sticky behavior
        env:
          NEWFUNC: 
        run: |
          python3 -c "import os,base64,pathlib; p=pathlib.Path('js/pages/oil-visual-builder.js'); s=p.read_text(); a=s.index('  function ensureStickyRate(){'); b=s.index('\\n\\n  window.STOT_VISUAL_PLOT_BUILDER',a); p.write_text(s[:a]+base64.b64decode(os.environ['NEWFUNC']).decode()+s[b:])"
          python3 -c "from pathlib import Path; p=Path('css/pages/oil-visual-builder.css'); s=p.read_text(); x='.v575-sticky-rate>*{pointer-events:none;user-select:none;-webkit-user-select:none}.v575-sticky-rate{touch-action:manipulation}'; p.write_text(s if x in s else s+x)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify exact behavior
        env:
          TESTJS: 
        run: |
          echo "$TESTJS" | base64 -d > /tmp/sticky-test.mjs
          node /tmp/sticky-test.mjs
      - name: Commit fix
        run: |
          rm -f package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/pages/oil-visual-builder.js css/pages/oil-visual-builder.css
          git commit -m 'Fix Current Production sticky navigation'
          git push origin HEAD:main
