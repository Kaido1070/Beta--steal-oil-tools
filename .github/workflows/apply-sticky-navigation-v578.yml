name: Apply Sticky Navigation v5.78

on:
  push:
    paths:
      - '.github/workflows/apply-sticky-navigation-v578.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch sticky navigation
        run: |
          python3 <<'PY'
          from pathlib import Path

          js=Path('js/pages/oil-visual-builder.js')
          s=js.read_text(encoding='utf-8')
          old="""  function ensureStickyRate(){
    let bar=document.getElementById('v575StickyRate');
    const rate=document.getElementById('layoutNowRate');
    const details=rate?.closest('.panel.result');
    if(!rate||!details)return null;
    details.id='layoutResultDetails';
    details.classList.add('v575-result-details');
    if(!bar){
      bar=document.createElement('button');
      bar.id='v575StickyRate';
      bar.className='v575-sticky-rate';
      bar.type='button';
      bar.setAttribute('aria-label','Current oil production. Tap to view details.');
      bar.innerHTML='<span><small>Current Production</small><strong data-v575-rate>0/s</strong></span><i>Details ↓</i>';
      document.body.appendChild(bar);
      bar.addEventListener('click',()=>{
        details.scrollIntoView({behavior:'smooth',block:'center'});
        details.classList.remove('v575-result-focus');
        requestAnimationFrame(()=>details.classList.add('v575-result-focus'));
        setTimeout(()=>details.classList.remove('v575-result-focus'),900);
      });
    }
    const sync=()=>{
      const out=bar.querySelector('[data-v575-rate]');
      if(out)out.textContent=rate.textContent?.trim()||'0/s';
      bar.classList.toggle('show',document.getElementById('oilView')?.classList.contains('active')===true);
    };
    sync();
    if(!bar.dataset.bound){
      bar.dataset.bound='1';
      new MutationObserver(sync).observe(rate,{childList:true,characterData:true,subtree:true});
      new MutationObserver(sync).observe(document.getElementById('oilView'),{attributes:true,attributeFilter:['class']});
      document.addEventListener('click',e=>{if(e.target.closest?.('[data-view]'))queueMicrotask(sync)});
    }
    return bar;
  }
"""
          new="""  function ensureStickyRate(){
    let bar=document.getElementById('v575StickyRate');
    const rate=document.getElementById('layoutNowRate');
    const details=rate?.closest('.panel.result');
    if(!rate||!details)return null;
    let navigatingToResult=false;
    details.id='layoutResultDetails';
    details.classList.add('v575-result-details');
    if(!bar){
      bar=document.createElement('button');
      bar.id='v575StickyRate';
      bar.className='v575-sticky-rate';
      bar.type='button';
      bar.setAttribute('aria-label','Current oil production. Tap to view details.');
      bar.innerHTML='<span><small>Current Production</small><strong data-v575-rate>0/s</strong></span><i>Details ↓</i>';
      document.body.appendChild(bar);
      bar.addEventListener('click',()=>{
        navigatingToResult=true;
        bar.classList.remove('show');
        details.scrollIntoView({behavior:'smooth',block:'center'});
        details.classList.remove('v575-result-focus');
        requestAnimationFrame(()=>details.classList.add('v575-result-focus'));
        setTimeout(()=>details.classList.remove('v575-result-focus'),900);
      });
    }
    const sync=()=>{
      const out=bar.querySelector('[data-v575-rate]');
      if(out)out.textContent=rate.textContent?.trim()||'0/s';
      const oilActive=document.getElementById('oilView')?.classList.contains('active')===true;
      const beforeResult=details.getBoundingClientRect().top>window.innerHeight-36;
      if(!beforeResult)navigatingToResult=false;
      bar.classList.toggle('show',oilActive&&beforeResult&&!navigatingToResult);
    };
    sync();
    if(!bar.dataset.bound){
      bar.dataset.bound='1';
      new MutationObserver(sync).observe(rate,{childList:true,characterData:true,subtree:true});
      new MutationObserver(sync).observe(document.getElementById('oilView'),{attributes:true,attributeFilter:['class']});
      document.addEventListener('click',e=>{if(e.target.closest?.('[data-view]'))queueMicrotask(sync)});
      window.addEventListener('scroll',sync,{passive:true});
      window.addEventListener('resize',sync,{passive:true});
    }
    return bar;
  }
"""
          if old not in s:
              raise SystemExit('Expected v5.75 sticky block not found')
          s=s.replace(old,new,1).replace('/* STOT Oil visual plot builder — v5.75 */','/* STOT Oil visual plot builder — v5.78 */',1)
          js.write_text(s,encoding='utf-8')

          css=Path('css/pages/oil-visual-builder.css')
          c=css.read_text(encoding='utf-8')
          anchor='.v575-sticky-rate:hover{border-color:#ae84ff}'
          inject='.v575-sticky-rate>*{pointer-events:none;user-select:none;-webkit-user-select:none}.v575-sticky-rate{touch-action:manipulation}'
          if inject not in c:
              if anchor not in c: raise SystemExit('Sticky CSS anchor missing')
              c=c.replace(anchor,anchor+inject,1)
          css.write_text(c,encoding='utf-8')

          build=Path('scripts/consolidate-beta.sh')
          b=build.read_text(encoding='utf-8')
          if 'VERSION="5.77"' not in b: raise SystemExit('Expected v5.77 build')
          build.write_text(b.replace('VERSION="5.77"','VERSION="5.78"',1),encoding='utf-8')

          ch=Path('js/changelog.js')
          h=ch.read_text(encoding='utf-8')
          marker='window.STOT_CHANGELOG=Object.freeze([\n'
          entry='''  Object.freeze({version:"5.78",date:"Sep 2 2026",changes:Object.freeze([\n    "Made the entire Current Production bar tappable",\n    "Hide it at the result and show it again when scrolling back above"\n  ])}),\n'''
          if 'version:"5.78"' not in h:
              h=h.replace(marker,marker+entry,1)
          ch.write_text(h,encoding='utf-8')

          test=Path('tests/smoke-beta.mjs')
          t=test.read_text(encoding='utf-8').replace("'5.77'","'5.78'")
          t=t.replace('stot-v5.77-layout-save-v1','stot-v5.78-layout-save-v1')
          old_test="""assert.equal(await page.locator('#v575StickyRate').count(), 1);
await page.locator('.tabs button[data-view="oil"]').click();
await page.waitForTimeout(80);
assert.ok(await page.locator('#v575StickyRate').evaluate(el => el.classList.contains('show')));
const stickyBox = await page.locator('#v575StickyRate').boundingBox();
assert.ok(stickyBox && stickyBox.height <= 52, 'Sticky production card is too tall');
const oilPaddingBottom = await page.locator('#oilView').evaluate(el => parseFloat(getComputedStyle(el).paddingBottom));
assert.ok(oilPaddingBottom >= 70, 'Oil view needs bottom spacing for sticky card');
assert.equal((await page.locator('#v575StickyRate [data-v575-rate]').textContent())?.trim(), (await page.locator('#layoutNowRate').textContent())?.trim());
assert.equal(await page.locator('#layoutResultDetails').count(), 1);
await page.locator('#v575StickyRate').click();
await page.waitForTimeout(80);
assert.ok(await page.locator('#layoutResultDetails').evaluate(el => el.classList.contains('v575-result-focus')));
"""
          new_test="""assert.equal(await page.locator('#v575StickyRate').count(), 1);
await page.locator('.tabs button[data-view="oil"]').click();
await page.waitForTimeout(80);
const stickyBox = await page.locator('#v575StickyRate').boundingBox();
assert.ok(stickyBox && stickyBox.height <= 52, 'Sticky production card is too tall');
const oilPaddingBottom = await page.locator('#oilView').evaluate(el => parseFloat(getComputedStyle(el).paddingBottom));
assert.ok(oilPaddingBottom >= 70, 'Oil view needs bottom spacing for sticky card');
assert.equal((await page.locator('#v575StickyRate [data-v575-rate]').textContent())?.trim(), (await page.locator('#layoutNowRate').textContent())?.trim());
assert.equal(await page.locator('#layoutResultDetails').count(), 1);
"""
          if old_test not in t: raise SystemExit('Expected old sticky smoke block missing')
          test.write_text(t.replace(old_test,new_test,1),encoding='utf-8')
          PY

      - name: Build v5.78
        run: bash scripts/consolidate-beta.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1

      - name: Full smoke suite
        run: node tests/smoke-beta.mjs

      - name: Verify sticky behavior
        run: |
          cat > sticky-test.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:600}});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.locator('.tabs button[data-view="oil"]').click();
          await page.waitForTimeout(120);
          const bar=page.locator('#v575StickyRate');
          const details=page.locator('#layoutResultDetails');
          assert.equal(await bar.count(),1);
          await details.evaluate(el=>{el.style.transform='translateY(1600px)'; window.scrollTo(0,0); window.dispatchEvent(new Event('scroll'));});
          await page.waitForTimeout(80);
          assert.ok(await bar.evaluate(el=>el.classList.contains('show')),'bar should show before result');
          assert.equal(await bar.evaluate(el=>el.tagName),'BUTTON');
          assert.equal(await bar.locator('span').evaluate(el=>getComputedStyle(el).pointerEvents),'none');
          assert.equal(await bar.locator('i').evaluate(el=>getComputedStyle(el).pointerEvents),'none');
          await bar.evaluate(el=>el.click());
          await page.waitForTimeout(80);
          assert.ok(!(await bar.evaluate(el=>el.classList.contains('show'))),'bar should hide immediately after tap');
          assert.ok(await details.evaluate(el=>el.classList.contains('v575-result-focus')),'tap should target result');
          await details.evaluate(el=>{el.style.transform='none'; el.scrollIntoView({behavior:'auto',block:'center'}); window.dispatchEvent(new Event('scroll'));});
          await page.waitForTimeout(80);
          assert.ok(!(await bar.evaluate(el=>el.classList.contains('show'))),'bar should stay hidden at result');
          await details.evaluate(el=>{el.style.transform='translateY(1600px)'; window.scrollTo(0,0); window.dispatchEvent(new Event('scroll'));});
          await page.waitForTimeout(80);
          assert.ok(await bar.evaluate(el=>el.classList.contains('show')),'bar should return after scrolling back above result');
          await browser.close();
          console.log('Sticky navigation behavior passed');
          JS
          node sticky-test.mjs

      - name: Commit tested fix
        run: |
          rm -f sticky-test.mjs package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/pages/oil-visual-builder.js css/pages/oil-visual-builder.css scripts/consolidate-beta.sh js/changelog.js tests/smoke-beta.mjs index.html
          git commit -m 'Fix Current Production sticky navigation v5.78'
          git push origin HEAD:main
