name: Mobile Three Column Plots

on:
  push:
    paths:
      - .github/workflows/mobile-three-column-plots.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply mobile three-column layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = Path('css/pages/oil-visual-builder.css')
          s = css.read_text(encoding='utf-8')
          marker = 'v5.86: keep all visual plots in three columns on phones'
          patch = r'''

/* v5.86: keep all visual plots in three columns on phones. */
@media(max-width:820px){
  .v572-plot-map{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
}
@media(max-width:520px){
  .v572-visual-builder{padding:8px}
  .v572-builder-head{gap:8px;margin-bottom:9px}
  .v572-builder-head h2{font-size:16px}
  .v572-builder-head p{font-size:10px;line-height:1.35}
  .v572-builder-head>span{padding:5px 7px;font-size:10px}
  .v572-map-summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .v572-summary-item{grid-template-columns:7px minmax(0,1fr);column-gap:4px;padding:5px;border-radius:8px}
  .v572-summary-item i{width:7px;height:7px}
  .v572-summary-item b{font-size:8px}
  .v572-summary-item small{font-size:7px;margin-top:1px}
  .v572-plot-map{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .v572-plot-card{padding:4px;border-radius:9px}
  .v572-plot-head{gap:3px;margin:0 0 4px}
  .v572-plot-head strong{font-size:9px}
  .v572-plot-head i{padding:2px 4px;font-size:7px}
  .v572-grid-stage{border-width:1px;border-radius:6px}
  .v572-grid-cells,.v572-grid-placements{inset:2px;gap:1px}
  .v572-grid-cells span{border-radius:2px}
  .v572-drill-block{padding:1px;border-radius:3px}
  .v572-drill-block b{font-size:5.5px}
  .v572-drill-block small{display:none}
  .v572-plot-foot{gap:3px;margin:4px 0 0;font-size:6.5px}
  .v572-plot-foot span:last-child{white-space:nowrap}
}
'''
          if marker not in s:
              s += patch
          css.write_text(s, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          import re
          html, n = re.subn(r'css/pages/oil-visual-builder\.css\?v=[0-9.]+', 'css/pages/oil-visual-builder.css?v=5.86', html, count=1)
          if n != 1:
              raise SystemExit('Could not bump oil visual builder cache version')
          index.write_text(html, encoding='utf-8')
          PY

      - name: Verify mobile rules
        run: |
          grep -F 'v5.86: keep all visual plots in three columns on phones' css/pages/oil-visual-builder.css
          grep -F '.v572-plot-map{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}' css/pages/oil-visual-builder.css
          grep -F 'css/pages/oil-visual-builder.css?v=5.86' index.html

      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/pages/oil-visual-builder.css index.html
          git commit -m 'Keep visual plots three columns on mobile v5.86'
          git push origin HEAD:main
