name: Mobile Three Columns

on:
  push:
    paths:
      - '.github/workflows/mobile-three-column-plots.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Force three columns and bust cache
        run: |
          sed -i 's/\.v572-plot-map{grid-template-columns:repeat(2,minmax(0,1fr))}/.v572-plot-map{grid-template-columns:repeat(3,minmax(0,1fr))}/g' css/pages/oil-visual-builder.css
          sed -i -E 's#css/pages/oil-visual-builder\.css\?v=[0-9.]+#css/pages/oil-visual-builder.css?v=5.87#' index.html
          sed -i -E 's#css/pages/oil-grid-editor-v585\.css\?v=[0-9.]+#css/pages/oil-grid-editor-v585.css?v=5.87#' index.html
          grep -F '.v572-plot-map{grid-template-columns:repeat(3,minmax(0,1fr))}' css/pages/oil-visual-builder.css
          grep -F 'oil-visual-builder.css?v=5.87' index.html
          grep -F 'oil-grid-editor-v585.css?v=5.87' index.html

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/pages/oil-visual-builder.css index.html
          git commit -m 'Force three plot columns on phones v5.87'
          git push origin HEAD:main
