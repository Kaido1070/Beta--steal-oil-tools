name: Step 4 Events Retry

on:
  push:
    branches: [consolidation-work]
    paths:
      - '.github/workflows/events-step4-rerun.yml'

permissions:
  contents: write

jobs:
  split-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation-work
          fetch-depth: 0

      - name: Apply the prepared Events patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/events-step4.yml').read_text(encoding='utf-8')
          token = "          python3 - <<'PY'\n"
          start = src.index(token) + len(token)
          end = src.index("\n          PY\n", start)
          lines = src[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'events-step4-patch', 'exec'))
          PY

      - name: Build v5.62 runtime
        run: bash scripts/consolidate-beta.sh

      - name: Verify Events extraction statically
        shell: bash
        run: |
          test -s js/pages/events.js
          test -s css/pages/events.css
          ! grep -q 'function renderEvents()' js/app.js
          ! grep -q 'const mapEvents=\[' js/app.js
          grep -q 'function renderEvents()' js/pages/events.js
          grep -q 'const mapEvents=\[' js/pages/events.js
          grep -q 'stotEventsPage' js/pages/events.js
          ! grep -q '/\* Events \*/' css/main.css
          grep -q '/\* Events \*/' css/pages/events.css
          grep -q 'js/pages/events.js?v=5.62' index.html
          grep -q 'css/pages/events.css?v=5.62' index.html
          node --check js/app.js
          node --check js/pages/events.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1

      - name: Run full browser smoke suite
        run: node tests/smoke-beta.mjs

      - name: Commit tested Events separation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/consolidate-beta.sh tests/smoke-beta.mjs index.html css/main.css css/app.bundle.css css/pages/database.css css/pages/events.css js/game-data.js js/app.js js/pages/database-core.js js/pages/database.js js/pages/events.js js/beta-patches.bundle.js
          if git diff --cached --quiet; then
            echo "No Events changes to commit"
            exit 0
          fi
          git commit -m "Separate Events page runtime v5.62"
          git push origin HEAD:consolidation-work
