name: Fix Pet Images v5.64

on:
  push:
    branches: [consolidation-work]

permissions:
  contents: write

jobs:
  build-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation-work
          fetch-depth: 0

      - name: Bump build version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/consolidate-beta.sh')
          s=p.read_text(encoding='utf-8')
          s=s.replace('VERSION="5.63"','VERSION="5.64"',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build current Beta
        run: bash scripts/consolidate-beta.sh

      - name: Verify pet atlas CSS fix
        shell: bash
        run: |
          grep -q 'stot-local-version" content="5.64"' index.html
          grep -q 'background-color:#101722!important' css/pages/database.css
          grep -q 'drill-logo:not(.v546-atlas-thumb){background:radial-gradient' css/pages/database.css
          if grep -F '.v557-db-card .drill-logo{width:var(--db-visual)!important;height:var(--db-visual)!important;min-width:var(--db-visual)!important;border-radius:14px!important;display:flex!important;align-items:center!important;justify-content:center!important;background:radial-gradient' css/pages/database.css; then
            echo 'Conflicting Database background shorthand still present' >&2
            exit 1
          fi
          node --check js/app.js
          node --check js/pages/database.js
          node --check js/beta-patches.bundle.js

      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Database pet images v5.64'
          git push origin HEAD:consolidation-work
