name: Step 5 Codes Retry

on:
  push:
    branches: [consolidation-work]
    paths:
      - '.github/workflows/codes-step5-rerun.yml'

permissions:
  contents: write

jobs:
  split-codes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation-work
          fetch-depth: 0

      - name: Apply prepared Codes patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/codes-step5.yml').read_text(encoding='utf-8')
          token = "          python3 - <<'PY'\n"
          start = src.index(token) + len(token)
          end = src.index("\n          PY\n", start)
          lines = src[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'codes-step5-patch', 'exec'))

          p = Path('scripts/consolidate-beta.sh')
          s = p.read_text(encoding='utf-8')
          marker = '# Fix a stale startup call left in the pinned core.'
          sync = r'''# Keep already-separated page module version markers aligned with this build.
          python3 <<'PY_PAGE_VERSIONS'
          from pathlib import Path
          p = Path('js/pages/events.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace('v5.62', 'v5.63').replace('stotEventsPage="5.62"', 'stotEventsPage="5.63"')
          p.write_text(text, encoding='utf-8')
          PY_PAGE_VERSIONS

          '''
          if '# Keep already-separated page module version markers aligned with this build.' not in s:
              if marker not in s:
                  raise SystemExit('Could not find version-sync insertion point')
              s = s.replace(marker, sync + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build v5.63 runtime
        run: bash scripts/consolidate-beta.sh

      - name: Verify separated page modules
        shell: bash
        run: |
          test -s js/pages/codes.js
          test -s css/pages/codes.css
          ! grep -q 'function renderCodes()' js/app.js
          ! grep -q 'const GAME_CODES=\[' js/app.js
          grep -q 'function renderCodes()' js/pages/codes.js
          grep -q 'const GAME_CODES=\[' js/pages/codes.js
          grep -q 'stotCodesPage="5.63"' js/pages/codes.js
          grep -q 'stotEventsPage="5.63"' js/pages/events.js
          ! grep -q '^\.codes-toolbar' css/main.css
          grep -q '^\.codes-toolbar' css/pages/codes.css
          grep -q 'js/pages/codes.js?v=5.63' index.html
          grep -q 'css/pages/codes.css?v=5.63' index.html
          node --check js/app.js
          node --check js/pages/events.js
          node --check js/pages/codes.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1

      - name: Run full browser smoke suite
        run: node tests/smoke-beta.mjs

      - name: Commit tested Codes separation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/consolidate-beta.sh tests/smoke-beta.mjs index.html css/main.css css/app.bundle.css css/pages/database.css css/pages/events.css css/pages/codes.css js/game-data.js js/app.js js/pages/database-core.js js/pages/database.js js/pages/events.js js/pages/codes.js js/beta-patches.bundle.js
          if git diff --cached --quiet; then
            echo "No Codes changes to commit"
            exit 0
          fi
          git commit -m "Separate Codes page runtime v5.63"
          git push origin HEAD:consolidation-work
