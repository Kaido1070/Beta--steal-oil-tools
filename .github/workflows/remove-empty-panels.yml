name: Remove Empty Panels
on:
  push:
    paths:
      - '.github/workflows/remove-empty-panels.yml'
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove empty legacy panels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/beta-patches.bundle.js')
          s=p.read_text(encoding='utf-8')
          patch=r'''

/* ===== remove-empty-panels-v582.js ===== */
try {
(() => {
  if (window.__STOT_REMOVE_EMPTY_PANELS_V582__) return;
  window.__STOT_REMOVE_EMPTY_PANELS_V582__ = true;

  const usefulSelector = 'input,select,textarea,button,img,svg,canvas,.plot-card,.drill-card,.metric,.actions,.v519-combined-summary,.v520-boosts,.v56-summary,.ab-compare,.v533-condition,.v536-quick-fill,#layoutAreas,#v575StickyRate';
  const roots = ['#oilView','#layoutcompareView','#saleView','#drillView','#compareView','#databaseView','#eventsView','#codesView'];

  function removable(panel){
    if (!panel || panel.id === 'v575StickyRate') return false;
    if (panel.matches('.v519-combined-summary,.v520-boosts,.v56-summary,.ab-compare,.v56-compare-intro,.v533-condition,.v536-quick-fill,.layout-control-card')) return false;
    if (panel.querySelector(usefulSelector)) return false;
    const text=(panel.textContent||'').replace(/\s+/g,' ').trim();
    return text.length===0;
  }

  function clean(){
    for(const rootSel of roots){
      const root=document.querySelector(rootSel);
      if(!root) continue;
      root.querySelectorAll(':scope > .panel, :scope > div > .panel').forEach(panel=>{
        if(removable(panel)) panel.remove();
      });
    }
    document.querySelectorAll('.v519-old-result,.v528-remove-empty,.v533-obsolete-empty').forEach(el=>{
      if(!el.querySelector(usefulSelector) && !(el.textContent||'').trim()) el.remove();
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',clean,{once:true});
  else clean();
  [0,80,220,500,1000].forEach(ms=>setTimeout(clean,ms));
  document.addEventListener('click',()=>setTimeout(clean,0),true);
  document.addEventListener('change',()=>setTimeout(clean,0),true);
})();
} catch (error) { console.error('STOT empty-panel cleanup failed', error); }
'''
          if 'remove-empty-panels-v582.js' not in s:
              s += patch
          p.write_text(s,encoding='utf-8')

          i=Path('index.html')
          html=i.read_text(encoding='utf-8')
          html=html.replace('js/beta-patches.bundle.js?v=5.80','js/beta-patches.bundle.js?v=5.82')
          i.write_text(html,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/beta-patches.bundle.js index.html
          git commit -m 'Remove empty panels from Beta UI'
          git push origin HEAD:main
