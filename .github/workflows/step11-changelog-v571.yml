name: Step 11 Central Changelog v5.71

on:
  push:
    branches: [consolidation-work]

permissions:
  contents: write

jobs:
  changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation-work
          fetch-depth: 0

      - name: Apply changelog migration
        run: python3 scripts/step11-changelog.py

      - name: Build v5.71 runtime
        run: bash scripts/consolidate-beta.sh

      - name: Verify changelog statically
        shell: bash
        run: |
          test -s js/changelog.js
          grep -q 'version:"5.71"' js/site-config.js
          grep -q 'lastUpdated:"Sep 2 2026"' js/site-config.js
          grep -q 'version:"5.71",date:"Sep 2 2026"' js/changelog.js
          grep -q 'js/changelog.js?v=5.71' index.html
          node --check js/changelog.js
          node --check js/site-config.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1

      - name: Run full browser smoke suite
        run: node tests/smoke-beta.mjs

      - name: Commit tested changelog
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/consolidate-beta.sh js/changelog.js js/site-config.js js/app.js js/pages js/beta-patches.bundle.js index.html tests/smoke-beta.mjs css/app.bundle.css css/pages
          git commit -m 'Add central changelog v5.71'
          git push origin HEAD:consolidation-work
