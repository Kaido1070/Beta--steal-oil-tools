name: Step 10 Central Site Config

on:
  push:
    branches: [consolidation-work]

permissions:
  contents: write

jobs:
  central-config:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation-work
          fetch-depth: 0

      - name: Apply central config migration
        run: python3 scripts/step10-central-config.py

      - name: Build v5.69 runtime
        run: bash scripts/consolidate-beta.sh

      - name: Verify central config statically
        shell: bash
        run: |
          test -s js/site-config.js
          grep -q 'version:"5.69"' js/site-config.js
          grep -q 'storageKey(scope' js/site-config.js
          grep -q 'const STOT_CONFIG=window.STOT_CONFIG' js/app.js
          grep -q 'const viewBadges={...STOT_CONFIG.pageBadges}' js/app.js
          grep -q 'STOT_CONFIG?.storageKey?.("layout-save")' js/v539-04.js
          grep -q 'js/site-config.js?v=5.69' index.html
          grep -q 'dataset.stotOilPage=STOT_CONFIG.version' js/pages/oil.js
          grep -q 'dataset.stotSalePage=STOT_CONFIG.version' js/pages/sale.js
          node --check js/site-config.js
          node --check js/app.js
          node --check js/pages/oil.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1

      - name: Run full browser smoke suite
        run: node tests/smoke-beta.mjs

      - name: Commit tested central config
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/consolidate-beta.sh js/site-config.js js/app.js js/v539-04.js js/pages/sale.js js/pages/oil.js js/pages/drills.js js/pages/compare.js js/pages/events.js js/pages/codes.js index.html tests/smoke-beta.mjs js/beta-patches.bundle.js js/pages/database.js css/app.bundle.css css/pages/database.css
          git commit -m 'Centralize runtime site settings v5.69'
          git push origin HEAD:consolidation-work
