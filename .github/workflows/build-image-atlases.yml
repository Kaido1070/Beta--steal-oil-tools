name: Build image atlases

on:
  push:
    paths:
      - 'tmp/pet-atlas-base64.txt'
      - 'tmp/drill-atlas-base64.txt'
      - '.github/workflows/build-image-atlases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify atlases
        shell: bash
        run: |
          set -euo pipefail
          test -s tmp/pet-atlas-base64.txt
          test -s tmp/drill-atlas-base64.txt
          wc -c tmp/pet-atlas-base64.txt tmp/drill-atlas-base64.txt
          mkdir -p assets/images/pets assets/images/drills
          tr -d '\r\n\t ' < tmp/pet-atlas-base64.txt | base64 -d > assets/images/pets/pets-atlas.webp
          tr -d '\r\n\t ' < tmp/drill-atlas-base64.txt | base64 -d > assets/images/drills/drills-atlas.webp
          file assets/images/pets/pets-atlas.webp
          file assets/images/drills/drills-atlas.webp
          grep -q 'Web/P image' <(file assets/images/pets/pets-atlas.webp)
          grep -q 'Web/P image' <(file assets/images/drills/drills-atlas.webp)
          test $(stat -c%s assets/images/pets/pets-atlas.webp) -gt 30000
          test $(stat -c%s assets/images/drills/drills-atlas.webp) -gt 70000
          rm -f tmp/pet-atlas-base64.txt tmp/drill-atlas-base64.txt
      - name: Commit decoded images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/pets/pets-atlas.webp assets/images/drills/drills-atlas.webp tmp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install real drill and pet image atlases'
          git push
