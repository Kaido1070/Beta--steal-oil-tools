name: Build image atlases

on:
  push:
    paths:
      - 'tmp/pet-atlas-base64.txt'
      - 'tmp/drill-atlas-base64.txt'
      - '.github/workflows/build-image-atlases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode atlases
        shell: bash
        run: |
          mkdir -p assets/images/pets assets/images/drills
          base64 -d tmp/pet-atlas-base64.txt > assets/images/pets/pets-atlas.webp
          base64 -d tmp/drill-atlas-base64.txt > assets/images/drills/drills-atlas.webp
          file assets/images/pets/pets-atlas.webp
          file assets/images/drills/drills-atlas.webp
          rm -f tmp/pet-atlas-base64.txt tmp/drill-atlas-base64.txt
      - name: Commit decoded images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/pets/pets-atlas.webp assets/images/drills/drills-atlas.webp tmp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install real drill and pet image atlases'
          git push
