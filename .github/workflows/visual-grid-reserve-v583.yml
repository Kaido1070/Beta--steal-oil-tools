name: Visual Grid Reserve v5.83

on:
  push:
    paths:
      - .github/workflows/visual-grid-reserve-v583.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch visual packing and colors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('js/pages/oil-visual-builder.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('  function packVisual(plot){')
          end=s.index('\n  function gridCells()', start)
          new=r'''  function packVisual(plot){
    const pieces=[];let totalArea=0;
    plot.rows.forEach((row,rowIndex)=>{
      const drill=drills.find(d=>d.id===row.drill);if(!drill)return;
      const [baseW,baseH]=fpSize(drill.footprint),count=Math.max(0,Math.floor(Number(row.count)||0));
      totalArea+=baseW*baseH*count;
      for(let instance=0;instance<count;instance++)pieces.push({row,rowIndex,drill,instance,baseW,baseH});
    });
    if(totalArea>25)return null;
    pieces.sort((a,b)=>(b.baseW*b.baseH)-(a.baseW*a.baseH)||Math.max(b.baseW,b.baseH)-Math.max(a.baseW,a.baseH)||a.rowIndex-b.rowIndex);

    function solve(reserve){
      const grid=Array(25).fill(false),placed=[];
      if(reserve){
        for(let yy=reserve.y;yy<reserve.y+reserve.h;yy++)for(let xx=reserve.x;xx<reserve.x+reserve.w;xx++)grid[yy*5+xx]=true;
      }
      const fits=(w,h,x,y)=>{if(x+w>5||y+h>5)return false;for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)if(grid[yy*5+xx])return false;return true};
      const set=(w,h,x,y,value)=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)grid[yy*5+xx]=value};
      const memo=new Set();
      function dfs(i){
        if(i===pieces.length)return true;
        const key=i+':'+grid.map(v=>v?'1':'0').join('');if(memo.has(key))return false;
        const piece=pieces[i],orients=piece.baseW===piece.baseH?[[piece.baseW,piece.baseH]]:[[piece.baseW,piece.baseH],[piece.baseH,piece.baseW]];
        for(const [w,h] of orients){
          for(let y=0;y<=5-h;y++)for(let x=0;x<=5-w;x++){
            if(!fits(w,h,x,y))continue;
            set(w,h,x,y,true);placed[i]={...piece,x,y,w,h};
            if(dfs(i+1))return true;
            placed[i]=null;set(w,h,x,y,false);
          }
        }
        memo.add(key);return false;
      }
      return dfs(0)?placed.filter(Boolean):null;
    }

    // Whenever four or more cells remain, first guarantee one contiguous 2x2
    // reserve. This is the space a 2x2 refinery can actually occupy later.
    if(25-totalArea>=4){
      const reserveOrder=[
        [3,3],[0,3],[3,0],[0,0],
        [2,3],[1,3],[3,2],[3,1],
        [0,2],[0,1],[2,0],[1,0],
        [2,2],[1,2],[2,1],[1,1]
      ];
      for(const [x,y] of reserveOrder){
        const packed=solve({x,y,w:2,h:2});
        if(packed)return packed;
      }
    }
    return solve(null);
  }
'''
          s=s[:start]+new+s[end:]
          s=s.replace('/* STOT Oil visual plot builder — v5.75 */','/* STOT Oil visual plot builder — v5.83 */',1)
          p.write_text(s,encoding='utf-8')

          c=Path('css/pages/oil-visual-builder.css')
          css=c.read_text(encoding='utf-8')
          css += r'''

/* v5.83: neutral drill fill that works with every area color. */
.v572-drill-block{
  border-color:rgba(157,205,255,.88)!important;
  background:linear-gradient(145deg,#286596,#173e67)!important;
  box-shadow:0 0 0 1px rgba(4,12,22,.80),0 0 8px rgba(42,112,170,.22)!important;
  color:#f7fbff!important;
}
.v572-drill-block small{color:#d9edff!important;opacity:.9!important}
.v572-drill-block b{color:#fff!important}
'''
          c.write_text(css,encoding='utf-8')

          i=Path('index.html')
          html=i.read_text(encoding='utf-8')
          html=re.sub(r'(css/pages/oil-visual-builder\.css\?v=)[0-9.]+',r'\g<1>5.83',html)
          html=re.sub(r'(js/pages/oil-visual-builder\.js\?v=)[0-9.]+',r'\g<1>5.83',html)
          i.write_text(html,encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1

      - name: Verify 2x2 reserve and neutral color
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:775,height:900}});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.locator('.tabs button[data-view="oil"]').click();
          await page.waitForTimeout(250);

          const result=await page.evaluate(()=>{
            const api=window.STOT_VISUAL_PLOT_BUILDER;
            const original=layoutPlots[0].rows.map(r=>({...r}));
            function has2x2(placed){
              const used=Array(25).fill(false);
              for(const p of placed||[])for(let y=p.y;y<p.y+p.h;y++)for(let x=p.x;x<p.x+p.w;x++)used[y*5+x]=true;
              for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(!used[y*5+x]&&!used[y*5+x+1]&&!used[(y+1)*5+x]&&!used[(y+1)*5+x+1])return true;
              return false;
            }
            const tests=[];
            layoutPlots[0].rows=[{drill:'banana',tier:0,count:5,hacker:550},{drill:'clock',tier:0,count:9,hacker:550}];
            let p1=api.pack(layoutPlots[0]);tests.push({area:pieceList(layoutPlots[0]).area,reserve:has2x2(p1)});
            layoutPlots[0].rows=[{drill:'demonic',tier:0,count:3,hacker:550},{drill:'clock',tier:0,count:1,hacker:550}];
            let p2=api.pack(layoutPlots[0]);tests.push({area:pieceList(layoutPlots[0]).area,reserve:has2x2(p2)});
            layoutPlots[0].rows=original;
            return tests;
          });
          assert.ok(result[0].area<=21 && result[0].reserve,JSON.stringify(result[0]));
          assert.ok(result[1].area<=21 && result[1].reserve,JSON.stringify(result[1]));
          const block=page.locator('.v572-drill-block').first();
          if(await block.count()){
            const bg=await block.evaluate(el=>getComputedStyle(el).backgroundImage);
            assert.ok(!/139, 72, 255|84, 44, 180/.test(bg),'old purple still active');
          }
          await browser.close();
          console.log('2x2 reserve tests passed',result);
          JS

      - name: Commit verified update
        run: |
          rm -f package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/pages/oil-visual-builder.js css/pages/oil-visual-builder.css index.html
          git commit -m 'Reserve 2x2 refinery space in visual plots v5.83'
          git push origin HEAD:main
