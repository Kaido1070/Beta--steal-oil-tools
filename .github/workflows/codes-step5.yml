name: Step 5 Separate Codes

on:
  push:
    branches: [consolidation-work]
    paths:
      - '.github/workflows/codes-step5.yml'

permissions:
  contents: write

jobs:
  split-codes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation-work
          fetch-depth: 0

      - name: Patch build pipeline for Codes page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/consolidate-beta.sh')
          s = p.read_text(encoding='utf-8')
          s = s.replace('VERSION="5.62"', 'VERSION="5.63"', 1)

          marker = '# Fix a stale startup call left in the pinned core.'
          if '# Step 5: move Codes behavior and styles out of the shared core.' not in s:
              step = r'''# Step 5: move Codes behavior and styles out of the shared core.
          python3 <<'PY_CODES'
          from pathlib import Path

          app_path = Path('js/app.js')
          codes_path = Path('js/pages/codes.js')
          codes_path.parent.mkdir(parents=True, exist_ok=True)
          app = app_path.read_text(encoding='utf-8')
          start_marker = 'const GAME_CODES=['
          end_marker = '\nconst viewBadges='

          if start_marker in app:
              start = app.index(start_marker)
              end = app.index(end_marker, start)
              block = app[start:end].strip()
              codes_path.write_text(
                  '/* STOT Codes page runtime v5.63 — extracted from js/app.js */\n'
                  + block
                  + '\n\n/* Initial Codes render now belongs to this page module. */\n'
                  + 'renderCodes();\n'
                  + 'document.documentElement.dataset.stotCodesPage="5.63";\n',
                  encoding='utf-8'
              )
              app = app[:start] + app[end+1:]
              startup = 'calcDrill();\nrenderCodes();\nrenderCompare();'
              if startup not in app:
                  raise SystemExit('Could not locate Codes startup call in js/app.js')
              app = app.replace(startup, 'calcDrill();\nrenderCompare();', 1)
              app_path.write_text(app, encoding='utf-8')
          else:
              if not codes_path.exists():
                  raise SystemExit('Codes already removed from app.js but js/pages/codes.js is missing')
              if 'function renderCodes()' in app or 'const GAME_CODES=[' in app:
                  raise SystemExit('Codes runtime still remains in js/app.js')

          css_path = Path('css/main.css')
          page_css = Path('css/pages/codes.css')
          css = css_path.read_text(encoding='utf-8')
          css_start = '.codes-toolbar'
          css_end = '\n\n@media(min-width:700px)'
          if css_start in css:
              start = css.index(css_start)
              end = css.index(css_end, start)
              block = css[start:end].strip()
              page_css.parent.mkdir(parents=True, exist_ok=True)
              page_css.write_text('/* STOT Codes page CSS v5.63 */\n' + block + '\n', encoding='utf-8')
              css_path.write_text(css[:start] + css[end:], encoding='utf-8')
          elif not page_css.exists():
              raise SystemExit('Codes CSS already removed from css/main.css but css/pages/codes.css is missing')
          PY_CODES

          '''
              if marker not in s:
                  raise SystemExit('Could not find insertion point in consolidate-beta.sh')
              s = s.replace(marker, step + marker, 1)

          old_style = "f'<link rel=\"stylesheet\" href=\"css/app.bundle.css?v={version}\">\\n<link rel=\"stylesheet\" href=\"css/pages/database.css?v={version}\">\\n<link rel=\"stylesheet\" href=\"css/pages/events.css?v={version}\">',"
          new_style = "f'<link rel=\"stylesheet\" href=\"css/app.bundle.css?v={version}\">\\n<link rel=\"stylesheet\" href=\"css/pages/database.css?v={version}\">\\n<link rel=\"stylesheet\" href=\"css/pages/events.css?v={version}\">\\n<link rel=\"stylesheet\" href=\"css/pages/codes.css?v={version}\">',"
          if old_style in s:
              s = s.replace(old_style, new_style, 1)
          elif 'css/pages/codes.css?v={version}' not in s:
              raise SystemExit('Could not patch Codes stylesheet into index generator')

          old_scripts = "f'<script defer src=\"js/pages/events.js?v={version}\"></script>\\n'\n    f'<script defer src=\"js/beta-patches.bundle.js?v={version}\"></script>\\n'"
          new_scripts = "f'<script defer src=\"js/pages/events.js?v={version}\"></script>\\n'\n    f'<script defer src=\"js/pages/codes.js?v={version}\"></script>\\n'\n    f'<script defer src=\"js/beta-patches.bundle.js?v={version}\"></script>\\n'"
          if old_scripts in s:
              s = s.replace(old_scripts, new_scripts, 1)
          elif 'js/pages/codes.js?v={version}' not in s:
              raise SystemExit('Could not patch Codes script into index generator')

          s = s.replace('node --check js/pages/events.js\nnode --check js/beta-patches.bundle.js', 'node --check js/pages/events.js\nnode --check js/pages/codes.js\nnode --check js/beta-patches.bundle.js', 1)
          s = s.replace("! grep -q 'const mapEvents=\\[' js/app.js", "! grep -q 'const mapEvents=\\[' js/app.js\n! grep -q 'function renderCodes()' js/app.js\n! grep -q 'const GAME_CODES=\\[' js/app.js", 1)
          s = s.replace("grep -q 'const mapEvents=\\[' js/pages/events.js", "grep -q 'const mapEvents=\\[' js/pages/events.js\ngrep -q 'function renderCodes()' js/pages/codes.js\ngrep -q 'const GAME_CODES=\\[' js/pages/codes.js", 1)
          s = s.replace('grep -q "css/pages/events.css?v=${VERSION}" index.html', 'grep -q "css/pages/events.css?v=${VERSION}" index.html\ngrep -q "css/pages/codes.css?v=${VERSION}" index.html', 1)
          s = s.replace('grep -q "js/pages/events.js?v=${VERSION}" index.html', 'grep -q "js/pages/events.js?v=${VERSION}" index.html\ngrep -q "js/pages/codes.js?v=${VERSION}" index.html', 1)
          s = s.replace('echo "Consolidated Beta v${VERSION}: Database and Events separated into page modules"', 'echo "Consolidated Beta v${VERSION}: Database, Events and Codes separated into page modules"', 1)
          p.write_text(s, encoding='utf-8')

          t = Path('tests/smoke-beta.mjs')
          test = t.read_text(encoding='utf-8').replace('5.62', '5.63')
          test = test.replace(
              "assert.equal(await page.locator('html').getAttribute('data-stot-events-page'), '5.63');",
              "assert.equal(await page.locator('html').getAttribute('data-stot-events-page'), '5.63');\nassert.equal(await page.locator('html').getAttribute('data-stot-codes-page'), '5.63');",
              1
          )
          test = test.replace(
              "assert.deepEqual(scriptSrcs, ['/js/game-data.js', '/js/app.js', '/js/pages/database.js', '/js/pages/events.js', '/js/beta-patches.bundle.js']);",
              "assert.deepEqual(scriptSrcs, ['/js/game-data.js', '/js/app.js', '/js/pages/database.js', '/js/pages/events.js', '/js/pages/codes.js', '/js/beta-patches.bundle.js']);"
          )
          test = test.replace(
              "assert.deepEqual(styleHrefs, ['/css/app.bundle.css', '/css/pages/database.css', '/css/pages/events.css']);",
              "assert.deepEqual(styleHrefs, ['/css/app.bundle.css', '/css/pages/database.css', '/css/pages/events.css', '/css/pages/codes.css']);"
          )
          code_test = r'''
          assert.equal(await page.evaluate(() => typeof renderCodes), 'function');
          await page.locator('.tabs button[data-view="codes"]').click();
          await page.waitForTimeout(120);
          assert.ok(await page.locator('#codesView').evaluate(el => el.classList.contains('active')));
          assert.ok(await page.locator('#codesList .code-card').count() > 0, 'Codes cards did not render');
          assert.match((await page.locator('#codesCount').textContent()) || '', /code/i, 'Codes count did not render');
          await page.locator('#codesSearch').fill('2026');
          await page.waitForTimeout(90);
          assert.equal(await page.locator('#codesList .code-card').count(), 1, 'Codes search did not narrow to one result');
          assert.match((await page.locator('#codesList .code-card').textContent()) || '', /2026/);
          assert.match((await page.locator('#codesList .code-card').textContent()) || '', /Hell Drill/i);
          await page.locator('#codesSearch').fill('');
          await page.locator('[data-code-filter="cash"]').click();
          await page.waitForTimeout(90);
          assert.ok(await page.locator('#codesList .code-card').count() > 0, 'Cash code filter returned no cards');
          '''
          anchor = "await page.locator('.tabs button[data-view=\"database\"]').click();"
          if code_test.strip() not in test:
              if anchor not in test:
                  raise SystemExit('Could not locate Database smoke-test anchor')
              test = test.replace(anchor, code_test + '\n' + anchor, 1)
          reload_anchor = "assert.equal(await page.locator('html').getAttribute('data-stot-events-page'), '5.63');\nassert.notEqual(await page.locator('body').evaluate(el => getComputedStyle(el).visibility), 'hidden');"
          reload_new = "assert.equal(await page.locator('html').getAttribute('data-stot-events-page'), '5.63');\nassert.equal(await page.locator('html').getAttribute('data-stot-codes-page'), '5.63');\nassert.notEqual(await page.locator('body').evaluate(el => getComputedStyle(el).visibility), 'hidden');"
          if reload_anchor in test:
              test = test.replace(reload_anchor, reload_new, 1)
          test = test.replace('SMOKE PASS: v5.63 Database + Events separated, calculators, Preset UI, images, filters, reload', 'SMOKE PASS: v5.63 Database + Events + Codes separated, calculators, Preset UI, images, filters, reload')
          t.write_text(test, encoding='utf-8')
          PY

      - name: Build v5.63 runtime
        run: bash scripts/consolidate-beta.sh

      - name: Verify Codes extraction statically
        shell: bash
        run: |
          test -s js/pages/codes.js
          test -s css/pages/codes.css
          ! grep -q 'function renderCodes()' js/app.js
          ! grep -q 'const GAME_CODES=\[' js/app.js
          grep -q 'function renderCodes()' js/pages/codes.js
          grep -q 'const GAME_CODES=\[' js/pages/codes.js
          grep -q 'stotCodesPage' js/pages/codes.js
          ! grep -q '^\.codes-toolbar' css/main.css
          grep -q '^\.codes-toolbar' css/pages/codes.css
          grep -q 'js/pages/codes.js?v=5.63' index.html
          grep -q 'css/pages/codes.css?v=5.63' index.html
          node --check js/app.js
          node --check js/pages/codes.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1

      - name: Run full browser smoke suite
        run: node tests/smoke-beta.mjs

      - name: Commit tested Codes separation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/consolidate-beta.sh tests/smoke-beta.mjs index.html css/main.css css/app.bundle.css css/pages/database.css css/pages/events.css css/pages/codes.css js/game-data.js js/app.js js/pages/database-core.js js/pages/database.js js/pages/events.js js/pages/codes.js js/beta-patches.bundle.js
          if git diff --cached --quiet; then
            echo "No Codes changes to commit"
            exit 0
          fi
          git commit -m "Separate Codes page runtime v5.63"
          git push origin HEAD:consolidation-work
