name: Oil Sticky Rate v5.75

on:
  push:
    paths:
      - '.github/workflows/oil-sticky-rate-v575.yml'

permissions:
  contents: write

jobs:
  sticky_rate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-v575.py
      - name: Build
        run: bash scripts/consolidate-beta.sh
      - name: Verify syntax
        run: |
          node --check js/pages/oil-visual-builder.js
          grep -q 'version:"5.75"' js/site-config.js
          grep -q 'v575-sticky-rate' css/pages/oil-visual-builder.css
          grep -q 'function ensureStickyRate' js/pages/oil-visual-builder.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1
      - name: Run browser smoke
        run: node tests/smoke-beta.mjs
      - name: Commit tested change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f scripts/apply-v575.py .github/workflows/oil-sticky-rate-v575.yml
          git commit -m 'Add sticky Oil production card v5.75'
          git push origin HEAD:main
