name: Smoke Test Consolidated Beta

on:
  push:
    branches: [consolidation-work]
    paths:
      - tests/smoke-beta.mjs
      - .github/workflows/smoke-beta.yml
      - index.html
      - js/**
      - css/**
      - assets/images/**

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation-work
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1
      - name: Run browser smoke suite
        run: node tests/smoke-beta.mjs
