name: Visual Plot Builder v5.72

on:
  push:
    branches: [visual-plot-builder-v572]

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-plot-builder-v572
          fetch-depth: 0

      - name: Apply v5.72 migration
        run: python3 scripts/apply-v572-visual-builder.py

      - name: Build v5.72 runtime
        run: bash scripts/consolidate-beta.sh

      - name: Verify visual builder statically
        run: |
          grep -q 'version:"5.72"' js/site-config.js
          grep -q 'lastUpdated:"Sep 2 2026"' js/site-config.js
          grep -q 'version:"5.72",date:"Sep 2 2026"' js/changelog.js
          grep -q 'js/pages/oil-visual-builder.js?v=5.72' index.html
          grep -q 'css/pages/oil-visual-builder.css?v=5.72' index.html
          node --check js/pages/oil-visual-builder.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stot-http.log
          exit 1

      - name: Run full browser smoke suite
        run: node tests/smoke-beta.mjs

      - name: Commit tested visual builder
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/consolidate-beta.sh js/changelog.js js/site-config.js index.html tests/smoke-beta.mjs js/pages/oil-visual-builder.js css/pages/oil-visual-builder.css
          git commit -m 'Add visual plot builder v5.72'
          git push origin HEAD:visual-plot-builder-v572
