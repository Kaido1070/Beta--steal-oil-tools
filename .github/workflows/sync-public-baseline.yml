name: Sync public baseline

on:
  push:
    paths:
      - '.github/workflows/sync-public-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4

      - name: Copy current public baseline
        run: |
          mkdir -p css js assets/images
          curl -fsSL https://raw.githubusercontent.com/Kaido1070/Steal-The-Oil-Tools/main/css/main.css -o css/main.css
          curl -fsSL https://raw.githubusercontent.com/Kaido1070/Steal-The-Oil-Tools/main/js/app.js -o js/app.js
          touch .nojekyll assets/images/.gitkeep

      - name: Commit baseline to beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll assets/images/.gitkeep css/main.css js/app.js
          if git diff --cached --quiet; then
            echo "Baseline already current"
            exit 0
          fi
          git commit -m "Sync public baseline for v5.39 beta"
          git push
