name: Install Compare Preset Sticky

on:
  push:
    paths:
      - '.github/workflows/install-compare-preset-sticky.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add compare preset sticky script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text()
          tag='<script defer src="js/pages/compare-preset-sticky.js?v=6.01"></script>'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('Missing </body> in index.html')
              text=text.replace('</body>', tag+'\n</body>', 1)
              p.write_text(text)
          PY

      - name: Verify install
        shell: bash
        run: |
          grep -q 'compare-preset-sticky.js' index.html
          test -f js/pages/compare-preset-sticky.js

      - name: Commit install
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Already installed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable live A B production bar in preset compare'
          git push
