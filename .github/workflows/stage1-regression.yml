name: Stage 1 Regression Tests

on:
  push:
    branches:
      - main
      - 'stage*/**'
    paths:
      - tests/**
      - package.json
      - index.html
      - js/**
      - css/**
      - assets/images/**
      - .github/workflows/stage1-regression.yml
  pull_request:
    branches:
      - main
    paths:
      - tests/**
      - package.json
      - index.html
      - js/**
      - css/**
      - assets/images/**
      - .github/workflows/stage1-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright browsers
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/stot-http.log
          exit 1

      - name: Desktop Chromium regression
        run: npm run test:desktop

      - name: Visual Builder ownership regression
        run: node tests/visual-builder-ownership-regression.mjs

      - name: Stage 3 Compare controller — Desktop Chromium
        run: node tests/stage3-compare-controller-regression.mjs

      - name: Stage 3 Compare controller — Mobile Chromium
        run: STOT_MOBILE=1 node tests/stage3-compare-controller-regression.mjs

      - name: Stage 3 Compare controller — Mobile WebKit
        run: STOT_BROWSER=webkit STOT_MOBILE=1 node tests/stage3-compare-controller-regression.mjs

      - name: Mobile Chromium regression
        run: npm run test:mobile

      - name: Mobile WebKit regression
        run: npm run test:mobile:webkit

      - name: Deployment regression
        run: npm run test:deployment
