name: Bind Current Production Click Final
on:
  push:
    paths:
      - '.github/workflows/bind-sticky-card-click-final.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bind click even when card already exists
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/pages/oil-visual-builder.js')
          s=p.read_text(encoding='utf-8')
          marker="""    const sync=()=>{\n"""
          patch="""    if(!bar.dataset.v581NavBound){\n      bar.dataset.v581NavBound='1';\n      bar.addEventListener('click',e=>{\n        e.preventDefault();\n        e.stopImmediatePropagation();\n        const target=getTarget();\n        if(!target)return;\n        navigatingToResult=true;\n        bar.classList.remove('show');\n        target.classList.add('v575-result-details');\n        target.scrollIntoView({behavior:'smooth',block:'center'});\n        target.classList.remove('v575-result-focus');\n        requestAnimationFrame(()=>target.classList.add('v575-result-focus'));\n        setTimeout(()=>target.classList.remove('v575-result-focus'),900);\n        setTimeout(()=>{navigatingToResult=false;sync()},1400);\n      },true);\n    }\n"""
          if 'v581NavBound' not in s:
              if marker not in s: raise SystemExit('sync marker not found')
              s=s.replace(marker,patch+marker,1)
          p.write_text(s,encoding='utf-8')

          c=Path('css/pages/oil-visual-builder.css')
          css=c.read_text(encoding='utf-8')
          patchcss='\n/* v5.81 click binding support */\n.v575-sticky-rate{z-index:2147483000!important}\n.v575-sticky-rate.show{pointer-events:auto!important}\n'
          if 'v5.81 click binding support' not in css: css+=patchcss
          c.write_text(css,encoding='utf-8')

          i=Path('index.html')
          html=i.read_text(encoding='utf-8')
          import re
          html=re.sub(r'(oil-visual-builder\.css\?v=)[0-9.]+',r'\g<1>5.81',html)
          html=re.sub(r'(oil-visual-builder\.js\?v=)[0-9.]+',r'\g<1>5.81',html)
          i.write_text(html,encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:775,height:617}});
          await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await p.locator('.tabs button[data-view="oil"]').click();
          await p.waitForTimeout(250);
          await p.evaluate(()=>scrollTo(0,0));
          await p.waitForTimeout(120);
          const bar=p.locator('#v575StickyRate');
          assert.ok(await bar.evaluate(e=>e.classList.contains('show')));
          assert.equal(await bar.getAttribute('data-v581-nav-bound'),'1');
          const box=await bar.boundingBox();
          assert.ok(box);
          const hit=await p.evaluate(({x,y})=>document.elementFromPoint(x,y)?.id||'',{x:box.x+box.width/2,y:box.y+box.height/2});
          assert.equal(hit,'v575StickyRate');
          const before=await p.evaluate(()=>scrollY);
          await p.mouse.click(box.x+box.width/2,box.y+box.height/2);
          await p.waitForTimeout(950);
          const after=await p.evaluate(()=>scrollY);
          assert.ok(after>before+20,`scroll failed ${before}->${after}`);
          assert.ok(await p.locator('.v575-result-focus').count()>=1);
          await b.close();
          console.log('physical click navigation passed');
          JS
      - name: Commit fix
        run: |
          rm -f package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/pages/oil-visual-builder.js css/pages/oil-visual-builder.css index.html
          git commit -m 'Bind Current Production card click reliably'
          git push origin HEAD:main
