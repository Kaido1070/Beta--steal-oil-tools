name: Fix Missing Current Production Card
on:
  push:
    paths:
      - '.github/workflows/fix-current-production-visible.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch sticky card against current UI
        env:
          NEWFUNC: 
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          p=Path('js/pages/oil-visual-builder.js')
          s=p.read_text(encoding='utf-8')
          a=s.index('  function ensureStickyRate(){')
          b=s.index('\n\n  window.STOT_VISUAL_PLOT_BUILDER',a)
          s=s[:a]+base64.b64decode(os.environ['NEWFUNC']).decode()+s[b:]
          p.write_text(s,encoding='utf-8')
          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          import re
          h=re.sub(r'oil-visual-builder\.css\?v=[0-9.]+','oil-visual-builder.css?v=5.81',h)
          h=re.sub(r'oil-visual-builder\.js\?v=[0-9.]+','oil-visual-builder.js?v=5.81',h)
          idx.write_text(h,encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the actual current page
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:775,height:617}});
          await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await p.locator('.tabs button[data-view="oil"]').click();
          await p.waitForTimeout(500);
          const bar=p.locator('#v575StickyRate');
          assert.equal(await bar.count(),1,'card must exist');
          assert.ok(await bar.evaluate(el=>el.classList.contains('show')),'card must be visible at top of current Oil / Hour page');
          const box=await bar.boundingBox();
          assert.ok(box&&box.height>20&&box.y<617,'card must render on screen');
          await b.close();
          console.log('Current Production card is visible on actual current Oil / Hour UI');
          JS
      - name: Commit verified fix
        run: |
          rm -f package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/pages/oil-visual-builder.js index.html
          git commit -m 'Restore Current Production card on current Oil UI'
          git push origin HEAD:main
