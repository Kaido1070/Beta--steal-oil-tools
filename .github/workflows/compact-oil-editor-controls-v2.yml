name: Compact Oil Editor Controls V2
on:
  push:
    paths:
      - '.github/workflows/compact-oil-editor-controls-v2.yml'
      - '.github/scripts/compact_editor_patch.py'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/compact_editor_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Verify mobile compact editor
        run: |
          python3 -m http.server 4173 >/tmp/stot-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node .github/scripts/test_compact_editor.mjs
      - name: Commit verified changes
        run: |
          rm -f package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/pages/oil-grid-editor-v585.js css/pages/oil-grid-editor-v585.css
          git commit -m 'Compact drill editor and add directional controls'
          git push origin HEAD:main
