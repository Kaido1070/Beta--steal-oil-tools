<title>STEAL THE OIL TYCOON — Community Tools</title>

<body>
<script>
(async()=>{
  const base="https://raw.githubusercontent.com/Kaido1070/Steal-The-Oil-Tools/aec48cd084062e3791d523b72cb65618948508c7/index.html";
  try{
    let html=await fetch(base,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.text()});
    html=html.replace("<head>",`<head>\n<meta name="stot-local-version" content="5.40">\n<meta name="stot-source-commit" content="aec48cd084062e3791d523b72cb65618948508c7">`);
    html=html.replaceAll("Weekend x2 Lobby","Admin Event Lobby");
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML="";
    console.error(err);
  }
})();
</script>
</body>
</html>
