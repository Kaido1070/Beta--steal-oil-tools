<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="stot-local-version" content="5.39">
<meta name="stot-source-commit" content="aec48cd084062e3791d523b72cb65618948508c7">
<title>STEAL THE OIL TYCOON — Beta v5.39</title>
<style>
html,body{margin:0;min-height:100%;background:#0b0d14;color:#eef1f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.beta-loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;box-sizing:border-box}.beta-loading div{max-width:420px}.beta-loading strong{display:block;font-size:18px}.beta-loading span{display:block;margin-top:8px;color:#98a2b8;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div class="beta-loading"><div><strong>Loading STOT Beta v5.39…</strong><span>Private staging build based on the tested public baseline.</span></div></div>
<script>
(async()=>{
  const base="https://raw.githubusercontent.com/Kaido1070/Steal-The-Oil-Tools/aec48cd084062e3791d523b72cb65618948508c7/index.html";
  try{
    let html=await fetch(base,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.text()});
    html=html.replace("<head>",`<head>\n<meta name="stot-local-version" content="5.39">\n<meta name="stot-source-commit" content="aec48cd084062e3791d523b72cb65618948508c7">`);
    html=html.replaceAll("Weekend x2 Lobby","Admin Event Lobby");
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.querySelector(".beta-loading").innerHTML=`<div><strong>Beta failed to load</strong><span>${String(err.message||err)}</span></div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
